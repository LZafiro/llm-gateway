server:
  addr: ":8080"
  log_level: info
  read_timeout: 10s
  shutdown_timeout: 10s

providers:
  anthropic:
    base_url: https://api.anthropic.com
  openai:
    base_url: https://api.openai.com
  mock:
    latency: 300ms
  response_header_timeout: 15s

routes:
  aliases:
    fast:
      - anthropic/claude-haiku-4-5
      - openai/gpt-4o-mini
  direct:
    - anthropic/claude-haiku-4-5
    - openai/gpt-4o-mini
    - mock/mock-1

resilience:
  max_attempts_per_provider: 2
  backoff_base: 100ms
  backoff_cap: 1s
  attempt_timeout: 15s
  request_deadline: 30s

breaker:
  window_size: 20
  min_calls: 5
  failure_ratio: 0.5
  open_duration: 10s
  half_open_probes: 1

chaos:
  public:
    enabled: true
    down_duration: 30s
    cooldown: 60s
  max_latency: 20s

auth:
  refresh_interval: 30s

pricing:
  anthropic/claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  openai/gpt-4o-mini:
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  mock/mock-1:
    input_per_mtok: 0.00
    output_per_mtok: 0.00

ledger:
  buffer_size: 10000
  batch_size: 100
  flush_interval: 1s
  retention: 720h
