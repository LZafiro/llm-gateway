name: llm-gateway

x-gateway-env: &gateway-env
  GATEWAY_CONFIG: /etc/gateway/config.yaml
  DATABASE_URL: ${DATABASE_URL:-postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  DEMO_API_KEY: ${DEMO_API_KEY:-}
  GOMEMLIMIT: 200MiB

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/lzafiro/llm-gateway}:${IMAGE_TAG:-main}
    command: ["serve"]
    environment: *gateway-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging
    networks: [internal]

  migrate:
    image: ${GATEWAY_IMAGE:-ghcr.io/lzafiro/llm-gateway}:${IMAGE_TAG:-main}
    command: ["migrate", "up"]
    environment: *gateway-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging
    networks: [internal]

  postgres:
    image: pgvector/pgvector:pg17
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  prometheus:
    image: prom/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped
    logging: *logging
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  promdata:
