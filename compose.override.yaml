services:
  gateway:
    image: llm-gateway:dev
    build:
      context: .
    volumes:
      - ./config.yaml:/etc/gateway/config.yaml:ro
    ports:
      - "8080:8080"

  migrate:
    image: llm-gateway:dev
    pull_policy: never

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  prometheus:
    ports:
      - "9090:9090"
