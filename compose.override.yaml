x-dev-providers: &dev-providers
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mock-key}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://mockprovider:8081}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mockprovider:8081}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}

services:
  gateway:
    image: llm-gateway:dev
    build:
      context: .
    environment: *dev-providers
    depends_on:
      mockprovider:
        condition: service_started
    volumes:
      - ./config.yaml:/etc/gateway/config.yaml:ro
    ports:
      - "8080:8080"

  migrate:
    image: llm-gateway:dev
    pull_policy: never

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  prometheus:
    ports:
      - "9090:9090"

  mockprovider:
    image: llm-gateway:dev
    pull_policy: never
    entrypoint: ["/usr/local/bin/mockprovider"]
    environment:
      MOCK_LATENCY: ${MOCK_LATENCY:-300ms}
    networks: [internal]
